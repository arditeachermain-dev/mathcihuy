      <div id="siswa-access-badge" class="hidden p-2.5 bg-slate-950/60 rounded-xl border border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">

      <button type="submit" id="btn-login-siswa" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm rounded-xl transition shadow-lg flex items-center justify-center gap-2 active:scale-98">

          <i class="fa-solid fa-lock text-amber-400 mr-1"></i> Password
        </label>
        <div class="relative">

            class="w-full px-3.5 py-2.5 bg-slate-950/90 border border-slate-800 focus:border-amber-500 rounded-xl text-white text-sm focus:outline-none transition pr-10" required>
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs">
            <i id="eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-login-guru" class="w-full py-3 bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-slate-950 font-black text-sm rounded-xl transition shadow-lg flex items-center justify-center gap-2 active:scale-98">
        <span>Masuk ke Dashboard Guru</span>
        <i class="fa-solid fa-shield-halved"></i>

    </form>
  </main>

    const SESSION_KEY = 'portal_session';

    // 2. CEK APAKAH SUDAH LOGIN
    window.addEventListener('DOMContentLoaded', () => {
      const sess = localStorage.getItem(SESSION_KEY);
      if (sess) {
        try {
          const parsed = JSON.parse(sess);
          if (Date.now() - parsed.timestamp < 24 * 60 * 60 * 1000) {
            window.location.href = 'index.html';
          }
        } catch (e) {}
      }
    });

    // 3. TAB SWITCHING
    function switchLoginTab(type) {
      hideAlert();
      const btnSiswa = document.getElementById('tab-btn-siswa');
      const btnGuru = document.getElementById('tab-btn-guru');
      const formSiswa = document.getElementById('form-siswa');
      const formGuru = document.getElementById('form-guru');

      if (type === 'siswa') {
        btnSiswa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-blue-600 text-white shadow-lg";
        btnGuru.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
        formSiswa.classList.remove('hidden');
        formGuru.classList.add('hidden');
      } else {
        btnGuru.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-amber-600 text-white shadow-lg";
        btnSiswa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
        formGuru.classList.remove('hidden');
        formSiswa.classList.add('hidden');
      }
    }

    // 4. DROPDOWN HANDLERS
    function handleKelasChange() {
      const kelasSelect = document.getElementById('siswa-kelas');
      const namaSelect = document.getElementById('siswa-nama');
      const nisInput = document.getElementById('siswa-nis');
      const badge = document.getElementById('siswa-access-badge');
      const accessLabel = document.getElementById('access-label');

      const k = kelasSelect.value;
      namaSelect.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
      nisInput.value = '';

      if (!k || !STUDENTS_DB[k]) {
        namaSelect.disabled = true;
        badge.classList.add('hidden');
        return;
      }

      namaSelect.disabled = false;
      const data = STUDENTS_DB[k];
      data.students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.nis;
        opt.textContent = s.name;
        namaSelect.appendChild(opt);
      });

      badge.classList.remove('hidden');
      if (data.access_level === 'full') {
        accessLabel.textContent = 'Akses Penuh (Wajib, Minat, CLIL)';
        accessLabel.className = 'font-bold text-emerald-400';
      } else {
        accessLabel.textContent = 'Matematika Wajib (F1/F2)';
        accessLabel.className = 'font-bold text-blue-400';
      }
    }

    function handleNamaChange() {
      const namaSelect = document.getElementById('siswa-nama');
      const nisInput = document.getElementById('siswa-nis');
      if (namaSelect.value) {
        nisInput.value = namaSelect.value;
      }
    }

    // 5. LOGIN SUBMISSIONS
    function handleSiswaLogin(e) {
      e.preventDefault();
      hideAlert();

      const kelas = document.getElementById('siswa-kelas').value;
      const nis = document.getElementById('siswa-nis').value.trim();

      if (!kelas || !STUDENTS_DB[kelas]) {
        showAlert('Silakan pilih kelas terlebih dahulu', 'error');
        return;
      }

      const student = STUDENTS_DB[kelas].students.find(s => s.nis === nis);
      if (!student) {
        showAlert('NIS tidak ditemukan di kelas yang dipilih. Pastikan NIS 8 digit sesuai.', 'error');
        return;
      }

      const sessionData = {
        type: 'siswa',
        data: {
          nis: student.nis,
          name: student.name,
          kelas: kelas,
          kelas_name: STUDENTS_DB[kelas].kelas_name,
          access_level: STUDENTS_DB[kelas].access_level
        },
        timestamp: Date.now()
      };

      localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
      showAlert(`Selamat datang, ${student.name}! Mengalihkan...`, 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }

    function handleGuruLogin(e) {
      e.preventDefault();
      hideAlert();

      const u = document.getElementById('guru-username').value.trim();
      const p = document.getElementById('guru-password').value;

      if (u !== GURU_CREDS.username) {
        showAlert('Username guru tidak valid', 'error');
        return;
      }

      const hash = CryptoJS.SHA256(p).toString();
      if (hash !== GURU_CREDS.password_hash) {
        showAlert('Password guru salah', 'error');
        return;
      }

      const sessionData = {
        type: 'guru',
        data: {
          username: u,
          name: 'M. Ardiansyah, S.Pd.Gr.'
        },
        timestamp: Date.now()
      };

      localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
      showAlert('Login Guru berhasil! Mengalihkan ke portal...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }

    // 6. UI HELPERS
    function showAlert(msg, type) {
      const box = document.getElementById('login-alert');
      const icon = document.getElementById('alert-icon');
      const text = document.getElementById('alert-text');

      box.classList.remove('hidden');
      text.textContent = msg;

      if (type === 'success') {
        box.className = "p-3 rounded-xl text-xs font-semibold mb-4 border flex items-center gap-2.5 bg-emerald-950/80 border-emerald-500/50 text-emerald-300";
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm shrink-0";
      } else {
        box.className = "p-3 rounded-xl text-xs font-semibold mb-4 border flex items-center gap-2.5 bg-rose-950/80 border-rose-500/50 text-rose-300";
        icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-sm shrink-0";
      }
    }

    function hideAlert() {
      document.getElementById('login-alert').classList.add('hidden');
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('guru-password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }
