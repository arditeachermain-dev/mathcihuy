        }

            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #F59E0B, #EC4899);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;

<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo" role="img" aria-label="Math Cihuy"></div>
            <div class="subtitle">Matematika Susah, Tapi Cihuuyy..</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('siswa')">Siswa</button>
            <button class="tab-btn" onclick="switchTab('guru')">Guru</button>
        </div>

        <!-- TAB SISWA -->
        <div id="siswa" class="tab-content active">
            <form onsubmit="loginSiswa(event)">
                <div class="form-group">
                    <label>NIS (Nomor Induk Siswa)</label>
                    <input type="text" id="nis" placeholder="Masukkan NIS" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="pwd-wrap">
                        <input type="password" id="password_siswa" placeholder="Masukkan password" required>
                        <button type="button" class="pwd-toggle" onclick="togglePasswordVis('password_siswa', this)" aria-label="Tampilkan atau sembunyikan password">👁</button>
                    </div>
                </div>

                <!-- Cloudflare Turnstile Siswa -->
                <div class="turnstile-wrapper">
                    <div id="turnstile-siswa" class="cf-turnstile-box"></div>
                </div>

                <button type="submit" id="btn_login_siswa" class="login-btn">Masuk</button>

                <div class="error" id="error_siswa"></div>
                <div class="success" id="success_siswa"></div>

            </form>
        </div>

        <!-- TAB GURU -->
        <div id="guru" class="tab-content">
            <form onsubmit="loginGuru(event)">
                <div class="form-group">
                    <label>Email / Username Guru</label>
                    <input type="text" id="email_guru" placeholder="Masukkan email atau username guru" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>Password Akun Guru</label>
                    <div class="pwd-wrap">
                        <input type="password" id="password_guru" placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="pwd-toggle" onclick="togglePasswordVis('password_guru', this)" aria-label="Tampilkan atau sembunyikan password">👁</button>
                    </div>
                </div>

                <!-- Cloudflare Turnstile Guru -->
                <div class="turnstile-wrapper">
                    <div id="turnstile-guru" class="cf-turnstile-box"></div>
                </div>

                <button type="submit" id="btn_login_guru" class="login-btn">Masuk sebagai Guru</button>

                <div class="error" id="error_guru"></div>
                <div class="success" id="success_guru"></div>

            </form>
        </div>

        <!-- PANEL WAJIB GANTI PASSWORD AWAL (UNTUK AKUN ONBOARDING 1234) -->
        <div id="change_pwd_panel" class="tab-content" style="display:none;">
            <form onsubmit="submitInitialPasswordChange(event)">
                <div style="font-size:13px; color:#facc15; margin-bottom:14px; line-height:1.5; background:rgba(250,204,21,0.1); padding:10px 12px; border-radius:10px; border:1px solid rgba(250,204,21,0.3);">
                    🔐 <b>Keamanan Akun Wajib:</b> Anda masih memakai password awal. Buat password pribadi baru minimal <b>8 karakter</b> sebelum masuk portal.
                </div>
                <div class="form-group">
                    <label>Password Baru (Min. 8 Karakter)</label>
                    <input type="password" id="new_pwd_first" placeholder="Kombinasi huruf dan angka" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Konfirmasi Password Baru</label>
                    <input type="password" id="confirm_pwd_first" placeholder="Ulangi password baru" minlength="8" required>
                </div>
                <button type="submit" id="btn_save_new_pwd" class="login-btn">Simpan Password &amp; Masuk Portal</button>
                <div class="error" id="error_new_pwd"></div>
                <div class="success" id="success_new_pwd"></div>
            </form>
        </div>
    </div>

    <script>
        // ===== CLOUDFLARE TURNSTILE (PRODUCTION FAIL-CLOSED ANTI-BOT) =====
        var turnstileWidgetSiswa = null;
        var turnstileWidgetGuru = null;
        var turnstileTokenSiswa = '';
        var turnstileTokenGuru = '';
        window.TURNSTILE_SITE_KEY = window.TURNSTILE_SITE_KEY || '';

        function renderTurnstileWidgets() {
            if (typeof turnstile === 'undefined') return;
            var siteKey = window.TURNSTILE_SITE_KEY || '';
            if (!siteKey) return;

            var elSiswa = document.getElementById('turnstile-siswa');
            if (elSiswa && turnstileWidgetSiswa === null) {
                try {
                    turnstileWidgetSiswa = turnstile.render('#turnstile-siswa', {
                        sitekey: siteKey,
                        theme: 'dark',
                        size: 'flexible',
                        callback: function(token) {
                            turnstileTokenSiswa = token;
                        },
                        'expired-callback': function() {
                            turnstileTokenSiswa = '';
                        },
                        'error-callback': function() {
                            turnstileTokenSiswa = '';
                        }
                    });
                } catch(err) {
                    console.warn('Turnstile Siswa render warn:', err);
                }
            }

            var elGuru = document.getElementById('turnstile-guru');
            if (elGuru && turnstileWidgetGuru === null) {
                try {
                    turnstileWidgetGuru = turnstile.render('#turnstile-guru', {
                        sitekey: siteKey,
                        theme: 'dark',
                        size: 'flexible',
                        callback: function(token) {
                            turnstileTokenGuru = token;
                        },
                        'expired-callback': function() {
                            turnstileTokenGuru = '';
                        },
                        'error-callback': function() {
                            turnstileTokenGuru = '';
                        }
                    });
                } catch(err) {
                    console.warn('Turnstile Guru render warn:', err);
                }
            }
        }

        window.onloadTurnstileCallback = function() {
            // Ambil Site Key dinamis dari server jika diatur pada environment Cloudflare Pages
            fetch('/api/auth?config=turnstile')
                .then(function(res) { return res.json(); })
                .then(function(cfg) {
                    if (cfg && cfg.turnstileSiteKey) {
                        window.TURNSTILE_SITE_KEY = cfg.turnstileSiteKey;
                    }
                    renderTurnstileWidgets();
                })
                .catch(function() {
                    renderTurnstileWidgets();
                });
        };

        function togglePasswordVis(inputId, btn) {
            var el = document.getElementById(inputId);
            if (!el) return;
            var show = el.type === 'password';
            el.type = show ? 'text' : 'password';
            if (btn) btn.textContent = show ? '🙈' : '👁';
        }

        // ===== TAB SWITCHING =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            // Render widget jika tab baru dibuka
            renderTurnstileWidgets();
        }

        // ===== PINDAH KE PORTAL =====
        // Portal ada di '/', BUKAN '/index.html'.
        // Cloudflare Pages memantulkan '/index.html' ke '/' (308) -> itu sumber loop.
        // Tiap tingkat punya halamannya sendiri: kelas 12 di '/', kelas 11 di
        // '/11'. Siswa diarahkan menurut kelasnya, jadi ia tidak pernah membuka
        // -- apalagi mengunduh -- materi tingkat lain.
        // Urutan pemeriksaan penting: 'XII F1' juga diawali 'XI' dan 'X'.
        function halamanTingkat(kelas) {
            var k = String(kelas || '').trim().toUpperCase();
            if (k.indexOf('ALUMNI') !== -1) return '/'; // Alumni bebas akses semua tingkat (default ke portal utama XII)
            if (k.indexOf('XII') === 0) return '/';
            if (k.indexOf('XI') === 0) return '/11';
            if (k.indexOf('X') === 0) return '/10';
            return '/';
        }

        function gotoPortal(kelas) {
            sessionStorage.removeItem('redirect_guard');
            window.location.replace(halamanTingkat(kelas));
        }

        var _pendingInitialPwd = '';
        var _pendingKelas = '';

        // ===== SISWA LOGIN =====
        async function loginSiswa(e) {
            e.preventDefault();
            var nis = document.getElementById('nis').value.trim();
            var password = document.getElementById('password_siswa').value;
            var errorEl = document.getElementById('error_siswa');
            var successEl = document.getElementById('success_siswa');
            var submitBtn = e.target.querySelector('button[type="submit"]');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Memverifikasi...';
            }

            var tokenToSubmit = turnstileTokenSiswa;
            if (!tokenToSubmit && typeof turnstile !== 'undefined' && turnstileWidgetSiswa !== null) {
                try { tokenToSubmit = turnstile.getResponse(turnstileWidgetSiswa); } catch(err) {}
            }

            try {
                const resp = await fetch('/api/auth', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        role: 'siswa',
                        nis: nis,
                        password: password,
                        turnstileToken: tokenToSubmit
                    })
                });
                const result = await resp.json();

                if (!resp.ok || !result.success) {
                    var authErr = new Error(result.error || 'NIS atau password belum cocok.');
                    authErr.status = resp.status;
                    throw authErr;
                }

                var student = result.user || {};
                var finalNama = student.nama || ('Siswa ' + (student.nis || nis));
                var finalKelas = student.kelas || 'XII';
                var canonicalNis = student.nis || nis;
                var isAlumni = finalKelas.toLowerCase().indexOf('alumni') !== -1;

                localStorage.setItem('portal_session', JSON.stringify({
                    type: 'siswa',
                    data: {
                        nis: canonicalNis,
                        name: finalNama,
                        nama: finalNama,
                        kelas_name: finalKelas,
                        kelas: finalKelas,
                        access_level: isAlumni ? 'all' : (student.access_level || (finalKelas.indexOf('F3') !== -1 || finalKelas.indexOf('F4') !== -1 ? 'full' : 'wajib_only'))
                    },
                    timestamp: Date.now()
                }));

                if (result.must_change_password) {
                    _pendingInitialPwd = password;
                    _pendingKelas = finalKelas;
                    document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); el.style.display = 'none'; });
                    var panel = document.getElementById('change_pwd_panel');
                    if (panel) {
                        panel.style.display = 'block';
                        panel.classList.add('active');
                    }
                    return;
                }

                successEl.textContent = 'Berhasil masuk. Sebentar, ya...';
                successEl.style.display = 'block';
                setTimeout(function () { gotoPortal(finalKelas); }, 120);

            } catch (err) {
                if (typeof turnstile !== 'undefined' && turnstileWidgetSiswa !== null) {
                    try { turnstile.reset(turnstileWidgetSiswa); } catch(e) {}
                    turnstileTokenSiswa = '';
                }

                errorEl.textContent = err.message || 'NIS atau password belum cocok.';
                errorEl.style.display = 'block';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Masuk';
                }
            }
        }

        async function submitInitialPasswordChange(e) {
            e.preventDefault();
            var newPwd = document.getElementById('new_pwd_first').value.trim();
            var confirmPwd = document.getElementById('confirm_pwd_first').value.trim();
            var errEl = document.getElementById('error_new_pwd');
            var okEl = document.getElementById('success_new_pwd');
            var btn = document.getElementById('btn_save_new_pwd');

            errEl.style.display = 'none';
            okEl.style.display = 'none';

            if (newPwd.length < 8) {
                errEl.textContent = 'Password baru minimal 8 karakter.';
                errEl.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                errEl.textContent = 'Konfirmasi password tidak cocok.';
                errEl.style.display = 'block';
                return;
            }

            if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan Password...'; }
            try {
                const resp = await fetch('/api/auth', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change_password',
                        current_password: _pendingInitialPwd,
                        new_password: newPwd
                    })
                });
                const res = await resp.json();
                if (!resp.ok || !res.success) {
                    throw new Error(res.error || 'Gagal menyimpan password baru.');
                }
                okEl.textContent = 'Password baru tersimpan aman! Mengalihkan ke portal...';
                okEl.style.display = 'block';
                setTimeout(function () { gotoPortal(_pendingKelas || 'XII'); }, 600);
            } catch (err) {
                errEl.textContent = err.message || 'Gagal mengganti password.';
                errEl.style.display = 'block';
                if (btn) { btn.disabled = false; btn.textContent = 'Simpan Password & Masuk Portal'; }
            }
        }

        // ===== GURU LOGIN VIA CLOUDFLARE D1 NATIVE AUTHENTICATION =====
        async function loginGuru(e) {
            e.preventDefault();
            var identifier = document.getElementById('email_guru').value.trim();
            var password = document.getElementById('password_guru').value;
            var errorEl = document.getElementById('error_guru');
            var successEl = document.getElementById('success_guru');
            var btn = document.getElementById('btn_login_guru');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Memverifikasi Akun Guru...';
            }

            var tokenToSubmit = turnstileTokenGuru;
            if (!tokenToSubmit && typeof turnstile !== 'undefined' && turnstileWidgetGuru !== null) {
                try { tokenToSubmit = turnstile.getResponse(turnstileWidgetGuru); } catch(err) {}
            }

            try {
                const resp = await fetch('/api/auth', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: identifier,
                        username: identifier,
                        identifier: identifier,
                        password: password,
                        role: 'guru',
                        turnstileToken: tokenToSubmit
                    })
                });
                const result = await resp.json();

                if (!resp.ok || !result.success) {
                    throw new Error(result.error || 'Email/username atau password guru salah. Silakan coba lagi.');
                }

                var user = result.user || {};
                var namaGuru = user.nama || 'M. Ardiansyah, S.Pd.Gr.';

                sessionStorage.removeItem('redirect_guard');
                localStorage.setItem('portal_session', JSON.stringify({
                    type: 'guru',
                    data: {
                        id: user.id || 'guru_ardi',
                        email: user.email,
                        username: user.username || (user.email ? user.email.split('@')[0] : 'arditeacher'),
                        name: namaGuru,
                        nama: namaGuru,
                        role: 'guru',
                        access_level: 'full'
                    },
                    timestamp: Date.now()
                }));

                successEl.textContent = 'Autentikasi Berhasil! Mengalihkan ke Portal Guru...';
                successEl.style.display = 'block';
                setTimeout(function () { gotoPortal('XII'); }, 120);

            } catch (err) {
                if (typeof turnstile !== 'undefined' && turnstileWidgetGuru !== null) {
                    try { turnstile.reset(turnstileWidgetGuru); } catch(e) {}
                    turnstileTokenGuru = '';
                }

                errorEl.textContent = err.message || 'Gagal masuk. Periksa kembali email dan password.';
                errorEl.style.display = 'block';
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Masuk sebagai Guru';
                }
            }
        }

        // ===== CEK SESI SAAT HALAMAN DIBUKA (VERIFIKASI SERVER) =====
        async function checkExistingSession() {
            if (sessionStorage.getItem('redirect_guard') === '1') {
                sessionStorage.removeItem('redirect_guard');
                localStorage.removeItem('portal_session');
                return;
            }

            try {
                var resp = await fetch('/api/auth', { credentials: 'same-origin' });
                if (resp.ok) {
                    var auth = await resp.json();
                    if (auth && auth.authenticated && auth.user && !auth.user.must_change_password) {
                        var u = auth.user;
                        localStorage.setItem('portal_session', JSON.stringify({
                            type: auth.role === 'guru' ? 'guru' : 'siswa',
                            data: u,
                            timestamp: Date.now()
                        }));
                        gotoPortal(u.kelas || '');
                        return;
                    }
                }
            } catch (_) {}

            localStorage.removeItem('portal_session');
        }

        window.addEventListener('DOMContentLoaded', checkExistingSession);
    </script>
</body>
