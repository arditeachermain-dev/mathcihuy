<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Matematika XII</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B2545 0%, #1a3a5c 50%, #071527 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 60px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #F59E0B, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #F59E0B;
            border-bottom-color: #F59E0B;
        }

        .tab-btn:hover {
            color: #cbd5e1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: rgba(51, 65, 85, 0.8);
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #F59E0B, #EC4899);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
            display: none;
        }

        .success {
            color: #10b981;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 6px;
            display: none;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 20px;
            }

            .logo {
                font-size: 36px;
            }
        }

        // ===== TAB SWITCHING =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // ===== PINDAH KE PORTAL =====
        // Portal ada di '/', BUKAN '/index.html'.
        // Cloudflare Pages memantulkan '/index.html' ke '/' (308) -> itu sumber loop.
        function gotoPortal() {
            sessionStorage.setItem('redirect_guard', '1');
            window.location.replace('/');
        }

        // ===== SISWA LOGIN =====
        function loginSiswa(e) {
            e.preventDefault();
            var nis = document.getElementById('nis').value.trim();
            var password = document.getElementById('password_siswa').value;
            var errorEl = document.getElementById('error_siswa');
            var successEl = document.getElementById('success_siswa');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!STUDENTS_DATA[nis]) {
                errorEl.textContent = 'NIS tidak ditemukan';
                errorEl.style.display = 'block';
                return;
            }
            if (password !== '1234') {
                errorEl.textContent = 'Password salah';
                errorEl.style.display = 'block';
                return;
            }

            var student = STUDENTS_DATA[nis];
            localStorage.setItem('portal_session', JSON.stringify({
                type: 'siswa',
                data: {
                    nis: nis,
                    // index.html membaca 'name' dan 'kelas_name' (header + kiriman
                    // hasil CBT ke Google Sheets). 'nama'/'kelas' ikut ditulis
                    // supaya tetap cocok kalau ada kode lain yang memakainya.
                    name: student.nama,
                    nama: student.nama,
                    kelas_name: student.kelas,
                    kelas: student.kelas,
                    access_level: student.access_level
                },
                timestamp: Date.now()
            }));

            successEl.textContent = 'Login berhasil! Mengalihkan...';
            successEl.style.display = 'block';
            setTimeout(gotoPortal, 500);
        }

            successEl.style.display = 'none';

            if (username !== GURU_CREDENTIALS.username) {

                errorEl.style.display = 'block';
                return;

                errorEl.style.display = 'block';

                },

            }));

            successEl.textContent = 'Login berhasil! Mengalihkan...';
            successEl.style.display = 'block';
            setTimeout(gotoPortal, 500);
        }

        // ===== CEK SESI SAAT HALAMAN DIBUKA =====
        function checkExistingSession() {
            // Pengaman: kalau baru dilempar balik dari portal, sesi ditolak.
            // Hapus sesi dan berhenti di sini -- jangan berputar lagi.
            if (sessionStorage.getItem('redirect_guard') === '1') {
                sessionStorage.removeItem('redirect_guard');
                localStorage.removeItem('portal_session');
                return;
            }

            var raw = localStorage.getItem('portal_session');
            if (!raw) return;

            var parsed;
            try {
                parsed = JSON.parse(raw);
            } catch (err) {
                localStorage.removeItem('portal_session');
                return;
            }

            if (Date.now() - (parsed.timestamp || 0) >= 24 * 60 * 60 * 1000) {
                localStorage.removeItem('portal_session');
                return;
            }

            gotoPortal();
        }

        window.addEventListener('DOMContentLoaded', checkExistingSession);
