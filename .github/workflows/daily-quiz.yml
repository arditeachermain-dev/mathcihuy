name: Kuis Sore Otomatis 16:00 WIB

on:
  schedule:
    # Menggunakan beberapa slot berurutan untuk menghindari antrean server GitHub Actions
    # Sistem Cloudflare D1 akan otomatis mengunci hanya 1 pengiriman per hari
    - cron: '55 8 * * *'  # 15:55 WIB (Slot utama mendahului antrean :00)
    - cron: '0 9 * * *'   # 16:00 WIB (Slot standar)
    - cron: '5 9 * * *'   # 16:05 WIB (Cadangan 1)
    - cron: '15 9 * * *'  # 16:15 WIB (Cadangan 2)
  workflow_dispatch:

jobs:
  broadcast-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Quiz Cron Endpoint
        run: |
          echo "Triggering 16:00 WIB Quiz Broadcast..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://mathcihuy.pages.dev/api/cron-quiz" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to broadcast quiz! Status: $STATUS"
            exit 1
          fi
          echo "Kuis Sore 16:00 WIB berhasil dieksekusi!"
