name: Kuis Sore Otomatis 16:00 WIB

on:
  schedule:
    # 09:00 UTC = 16:00 WIB (Setiap hari)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  broadcast-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Quiz Cron Endpoint
        run: |
          echo "Triggering 16:00 WIB Quiz Broadcast..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://mathcihuy.pages.dev/api/cron-quiz" \
            -H "Authorization: Bearer mathcihuy-super-secret-cron-2026" \
            -H "Content-Type: application/json")
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to broadcast quiz! Status: $STATUS"
            exit 1
          fi
          echo "Kuis Sore 16:00 WIB berhasil disiarkan ke Discord!"
